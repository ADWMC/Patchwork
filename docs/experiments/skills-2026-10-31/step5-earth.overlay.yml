# Isolated Earth UI task only. Supply PATCHWORK_STEPFUN_KEY in process environment.
- id: llm-pi-ai
  config:
    providers:
      stepfun-isolated:
        displayName: StepFun isolated Earth UI validation
        api: openai-completions
        apiKeyEnv: PATCHWORK_STEPFUN_KEY
        baseURL: https://api.stepfun.com/step_plan/v1
        defaultMaxTokens: 8192
        timeoutMs: 120000
        retryPolicy:
          mode: normal
          maxRetries: 1
        models:
          - id: step-5-preview
            name: Step 5 Preview isolated Earth UI
            contextWindow: 1000000
            maxTokens: 8192
            reasoningEfforts: false
- id: agent-default-model
  config:
    provider: stepfun-isolated
    model: step-5-preview
