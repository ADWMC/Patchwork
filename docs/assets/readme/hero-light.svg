<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Patchwork</title>
  <desc id="desc">Coding workflows for DeepSeek Harness: tasks, context and evidence, scoped to your session. An interlocking patchwork of colored tiles illustrates the modular design.</desc>
