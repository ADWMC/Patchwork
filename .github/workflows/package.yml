name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: build installable tarballs
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Configure isolated test home
        shell: pwsh
        run: |
          "DSH_HOME=$env:RUNNER_TEMP/patchwork-package-dsh" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Regression tests read a pinned historical commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned package manager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.2
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit locked dependencies
        run: pnpm audit --audit-level=high
      - name: Verify real-model audit evidence
        run: npm run audit:verify
      - name: Run regression tests
        run: npm test
      - name: Check committed client bundles
        run: |
          node scripts/build-client.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/browser/scripts/build-client.mjs --check
      - name: Check local documentation links
        run: npm run check:docs
      - name: Check coding-agent package
        run: npm run check:release
      - name: Check optional browser package
        run: npm --prefix packages/browser run check:release
      - name: Pack coding-agent package
        run: npm run pack:local -- --pack-destination "$env:GITHUB_WORKSPACE/dist"
      - name: Pack optional browser package
        working-directory: packages/browser
        run: npm pack --ignore-scripts --pack-destination "$env:GITHUB_WORKSPACE/dist"
      - name: Upload tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patchwork-packages-${{ github.run_id }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
