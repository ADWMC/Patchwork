name: 体验改进 / Feature request
description: 说明实际任务中遇到的困难和可以验证的改进结果。
body:
  - type: textarea
    id: task
    attributes:
      label: 你在完成什么任务？
      description: 描述实际使用场景，以及现在发生的失败或需要反复纠正的地方。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 怎样才算改善？
      description: 描述希望完成的操作、预期结果和可复查的验证方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有办法与参考
      description: 可选；提供当前绕行办法、相关项目或参考资料。
